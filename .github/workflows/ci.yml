# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, Build, Test & CALM Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Validate self-architecture and all demo timelines with official @finos/calm-cli
        run: |
          npx --yes --package=@finos/calm-cli@1.72.0 -c '
            calm validate -a architecture.calm.json
            for tl in docs/demos/*/*.timeline.json; do
              echo "Validating $tl"
              calm validate --timeline "$tl"
            done
          '
